name: Bug report
description: Report a bug in Much More Dungeons
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: "1.1.3"
    validations:
      required: true
  - type: input
    id: mc
    attributes:
      label: Minecraft / loader
      placeholder: "1.20.1 Fabric"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
